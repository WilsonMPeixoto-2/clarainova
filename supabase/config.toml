# Supabase project ref (set by `supabase link --project-ref ...`)
# Keep this as a placeholder to avoid accidentally deploying to an old/deleted project.
project_id = "REPLACE_WITH_YOUR_PROJECT_REF"

# Public chat/search endpoints stay open. Administrative endpoints now require a valid Supabase session JWT.
[functions.clara-chat]
verify_jwt = false

[functions.log-frontend-error]
verify_jwt = false

[functions.admin-auth]
verify_jwt = true

[functions.admin-analytics]
verify_jwt = true

[functions.admin-upload]
verify_jwt = false

[functions.admin_get_upload_url]
verify_jwt = true

[functions.documents]
verify_jwt = true

[functions.search]
verify_jwt = false

[functions.web-search]
verify_jwt = false
